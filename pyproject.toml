[project]
name = "pr-reviewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vinay-1312", email = "vinaysld123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
receiver = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "google-cloud-pubsub>=2.26",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.115",
    "google-cloud-pubsub>=2.26",
]

[project.scripts]
pr-reviewer = "pr_reviewer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
